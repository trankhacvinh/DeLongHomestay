<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đặt phòng - De Long Homestay</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><div data-public-header></div><main class="page-hero"><div class="container"><div class="breadcrumb"><a href="rooms.html">Phòng</a> / Gửi yêu cầu đặt phòng</div><div class="detail-grid"><section class="booking-card"><span class="eyebrow">Yêu cầu đặt phòng</span><h1 style="margin:12px 0 5px">Thông tin của bạn</h1><p class="muted small">Nhân viên sẽ kiểm tra lịch và liên hệ xác nhận trước khi booking chính thức.</p><form id="bookingForm" class="form-grid mt-24"><input type="hidden" id="roomId"><div class="field"><label>Tên khách *</label><input id="guestName" required placeholder="Nguyễn Văn A"></div><div class="field"><label>Số điện thoại *</label><input id="phone" required placeholder="09xxxxxxxx"></div><div class="field"><label>Check-in *</label><input id="checkIn" type="datetime-local" required></div><div class="field"><label>Check-out *</label><input id="checkOut" type="datetime-local" required></div><div class="field"><label>Hình thức</label><select id="method"></select></div><div class="field"><label>Nguồn biết đến</label><select id="source"></select></div><div class="field"><label>Giá phòng dự kiến</label><input id="basePrice" type="number" min="0" step="1000"></div><div class="field"><label>Phụ phí</label><input id="surcharge" type="number" min="0" step="1000" value="0"></div><div class="field full"><label>Yêu cầu / ghi chú</label><textarea id="note" placeholder="Ví dụ: nhận phòng 22:30, thêm 1 gối..."></textarea></div><div class="full"><button class="btn btn-primary" style="width:100%" type="submit">Gửi yêu cầu đặt phòng</button></div></form></section><aside class="booking-card sticky-card"><div class="room-image" style="border-radius:14px"><img id="bookingThumb" alt="Phòng"></div><h3 id="bookingRoomName"></h3><div class="summary-box"><div class="summary-line"><span>Giá phòng</span><strong id="sumBase"></strong></div><div class="summary-line"><span>Phụ phí</span><strong id="sumSurcharge"></strong></div><div class="summary-line total"><span>Tổng dự kiến</span><strong id="sumTotal"></strong></div></div><div class="notice mt-16">Đây là demo. Không thực hiện thanh toán thật trên trang khách.</div></aside></div></div></main><div data-public-footer></div><script type="module" src="assets/js/pages/booking.js"></script></body></html>
