name: Wire Site CMS SEO

on:
  push:
    branches: [agent/site-cms-and-lookup]
    paths:
      - '.github/workflows/site-cms-seo-patch.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-cms-and-lookup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 tools/site_cms_seo_patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DeLong.Web/Program.cs src/DeLong.Web/Pages/Shared/_Layout.cshtml
          git commit -m "feat: wire public SEO endpoints and structured data"
          git push origin HEAD:agent/site-cms-and-lookup
