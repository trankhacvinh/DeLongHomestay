name: UAT Editorial UX Polish

on:
  push:
    branches: [ "feat/property-gallery-blog" ]

permissions:
  contents: write

jobs:
  polish:
    if: ${{ !contains(github.event.head_commit.message, 'ux: polish gallery blog navigation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/property-gallery-blog
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet restore DeLongHomestay.sln
      - name: Apply UX changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def read(path): return Path(path).read_text()
          def write(path, value): Path(path).write_text(value)
          def repl(path, old, new, count=1):
              text = read(path)
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}: {old[:120]!r}')
              text = text.replace(old, new, count)
              write(path, text)

          # Persist gallery layout per property and for the global homepage showcase.
          repl('src/DeLong.Web/Domain/Entities/PropertySiteSettings.cs',
               '    public string? CoverImageUrl { get; set; }\n',
               '    public string? CoverImageUrl { get; set; }\n    public string GalleryLayout { get; set; } = "mosaic";\n')
          repl('src/DeLong.Web/Domain/Entities/GlobalEditorialShowcase.cs',
               '    public string GalleryTitle { get; set; } = "Một vài khoảnh khắc tại De Long";\n',
               '    public string GalleryTitle { get; set; } = "Một vài khoảnh khắc tại De Long";\n    public string GalleryLayout { get; set; } = "mosaic";\n')

          repl('src/DeLong.Web/Data/AppDbContext.cs',
               '        modelBuilder.Entity<PropertyGalleryItem>(entity =>\n',
               '        modelBuilder.Entity<PropertySiteSettings>(entity =>\n        {\n            entity.Property(x => x.GalleryLayout).HasMaxLength(30).HasDefaultValue("mosaic").IsRequired();\n        });\n\n        modelBuilder.Entity<PropertyGalleryItem>(entity =>\n')
          repl('src/DeLong.Web/Data/AppDbContext.cs',
               '            entity.Property(x => x.GalleryTitle).HasMaxLength(240).IsRequired();\n',
               '            entity.Property(x => x.GalleryTitle).HasMaxLength(240).IsRequired();\n            entity.Property(x => x.GalleryLayout).HasMaxLength(30).HasDefaultValue("mosaic").IsRequired();\n')

          # Property editorial service: include/save display mode.
          p = 'src/DeLong.Web/Features/Site/PropertyEditorialContentService.cs'
          repl(p,
               'public sealed record PropertyEditorialAdminDto(\n    IReadOnlyList<GalleryItemDto> Gallery,\n    IReadOnlyList<BlogPostDto> Posts);',
               'public sealed record PropertyEditorialAdminDto(\n    IReadOnlyList<GalleryItemDto> Gallery,\n    IReadOnlyList<BlogPostDto> Posts,\n    string GalleryLayout);')
          repl(p,
               'public sealed record ReorderGalleryRequest(IReadOnlyList<Guid> Ids);\n',
               'public sealed record ReorderGalleryRequest(IReadOnlyList<Guid> Ids);\npublic sealed record SaveGalleryLayoutRequest(string Layout);\n')
          repl(p,
               '        return new(\n            await GetGalleryQuery(propertyId, includeUnpublished: true).ToListAsync(ct),\n            await GetBlogQuery(propertyId, includeUnpublished: true).ToListAsync(ct));',
               '        return new(\n            await GetGalleryQuery(propertyId, includeUnpublished: true).ToListAsync(ct),\n            await GetBlogQuery(propertyId, includeUnpublished: true).ToListAsync(ct),\n            await GetGalleryLayoutAsync(propertyId, ct));')
          marker = '    public Task<List<BlogPostDto>> GetGlobalPublicPostsAsync(CancellationToken ct = default) =>\n        GetBlogQuery(null, includeUnpublished: false).ToListAsync(ct);\n'
          addition = marker + '''\n\n    public async Task<string> GetGalleryLayoutAsync(Guid propertyId, CancellationToken ct = default)\n    {\n        var layout = await db.Set<PropertySiteSettings>().AsNoTracking()\n            .Where(x => x.PropertyId == propertyId)\n            .Select(x => x.GalleryLayout)\n            .SingleOrDefaultAsync(ct);\n        return NormalizeGalleryLayout(layout);\n    }\n\n    public async Task<SiteContentError?> SaveGalleryLayoutAsync(Guid propertyId, string? layout, CancellationToken ct = default)\n    {\n        if (!await db.Properties.AnyAsync(x => x.Id == propertyId, ct))\n            return new("not_found", "Không tìm thấy cơ sở.");\n        var normalized = NormalizeGalleryLayout(layout);\n        if (!string.Equals(layout, normalized, StringComparison.OrdinalIgnoreCase) && !string.IsNullOrWhiteSpace(layout))\n            return new("validation", "Kiểu hiển thị Gallery không hợp lệ.");\n        var settings = await db.Set<PropertySiteSettings>().SingleOrDefaultAsync(x => x.PropertyId == propertyId, ct);\n        if (settings is null)\n        {\n            settings = new PropertySiteSettings { PropertyId = propertyId };\n            db.Set<PropertySiteSettings>().Add(settings);\n        }\n        settings.GalleryLayout = normalized;\n        await db.SaveChangesAsync(ct);\n        return null;\n    }'''
          repl(p, marker, addition)
          repl(p,
               '    public static string NormalizeSlug(string value)\n',
               '    private static string NormalizeGalleryLayout(string? value) =>\n        string.Equals(value, "grid", StringComparison.OrdinalIgnoreCase) ? "grid" :\n        string.Equals(value, "slider", StringComparison.OrdinalIgnoreCase) ? "slider" : "mosaic";\n\n    public static string NormalizeSlug(string value)\n')

          # Endpoint for property gallery display mode.
          ep = 'src/DeLong.Web/Features/Site/PropertyEditorialContentEndpoints.cs'
          repl(ep,
               '        admin.MapPut("/gallery/reorder", async (Guid propertyId, ReorderGalleryRequest request, PropertyEditorialContentService service, CancellationToken ct) =>\n',
               '        admin.MapPut("/gallery/layout", async (Guid propertyId, SaveGalleryLayoutRequest request, PropertyEditorialContentService service, CancellationToken ct) =>\n        {\n            var error = await service.SaveGalleryLayoutAsync(propertyId, request.Layout, ct);\n            return error is null ? Results.NoContent() : ToProblem(error);\n        }).AddEndpointFilter<ApiAntiforgeryFilter>();\n\n        admin.MapPut("/gallery/reorder", async (Guid propertyId, ReorderGalleryRequest request, PropertyEditorialContentService service, CancellationToken ct) =>\n')

          # Global editorial showcase: add layout setting.
          g = 'src/DeLong.Web/Features/Site/GlobalEditorialShowcaseService.cs'
          repl(g, '    string GalleryTitle,\n    bool BlogEnabled,', '    string GalleryTitle,\n    string GalleryLayout,\n    bool BlogEnabled,')
          repl(g, '    public string? GalleryTitle { get; init; }\n', '    public string? GalleryTitle { get; init; }\n    public string GalleryLayout { get; init; } = "mosaic";\n')
          repl(g,
               '        if (request.GalleryMode is not ("all" or "properties" or "manual") || request.BlogMode is not ("all" or "properties" or "manual"))\n            return (null, new("validation", "Chế độ chọn nội dung không hợp lệ."));',
               '        if (request.GalleryMode is not ("all" or "properties" or "manual") || request.BlogMode is not ("all" or "properties" or "manual"))\n            return (null, new("validation", "Chế độ chọn nội dung không hợp lệ."));\n        if (request.GalleryLayout is not ("mosaic" or "grid" or "slider"))\n            return (null, new("validation", "Kiểu hiển thị Gallery không hợp lệ."));')
          repl(g, '        entity.GalleryTitle = Clean(request.GalleryTitle) ?? "Một vài khoảnh khắc tại De Long";\n', '        entity.GalleryTitle = Clean(request.GalleryTitle) ?? "Một vài khoảnh khắc tại De Long";\n        entity.GalleryLayout = request.GalleryLayout;\n')
          repl(g, '        entity.GalleryTitle,\n        entity.BlogEnabled,', '        entity.GalleryTitle,\n        entity.GalleryLayout,\n        entity.BlogEnabled,')

          # Page models know which editorial area was requested.
          p = 'src/DeLong.Web/Pages/Admin/Site/Editorial.cshtml.cs'
          repl(p, '    public async Task<IActionResult> OnGetAsync(Guid? propertyId, CancellationToken ct)\n', '    public async Task<IActionResult> OnGetAsync(Guid? propertyId, string? tab, CancellationToken ct)\n')
          repl(p, '        PageDataJson = JsonSerializer.Serialize(new\n        {\n            propertyId = property.Id,\n', '        var selectedTab = string.Equals(tab, "blog", StringComparison.OrdinalIgnoreCase) ? "blog" : "gallery";\n        PageDataJson = JsonSerializer.Serialize(new\n        {\n            propertyId = property.Id,\n')
          repl(p, '            siteSlug,\n            isAdmin = User.IsInRole("Admin")\n', '            siteSlug,\n            tab = selectedTab,\n            isAdmin = User.IsInRole("Admin")\n')

          p = 'src/DeLong.Web/Pages/Admin/Site/EditorialGlobal.cshtml.cs'
          repl(p, '    public async Task OnGetAsync(CancellationToken ct)\n', '    public async Task OnGetAsync(string? tab, CancellationToken ct)\n')
          repl(p, '        PageDataJson = JsonSerializer.Serialize(new { properties = catalog.Properties }, new JsonSerializerOptions(JsonSerializerDefaults.Web));', '        var selectedTab = string.Equals(tab, "blog", StringComparison.OrdinalIgnoreCase) ? "blog" : "gallery";\n        PageDataJson = JsonSerializer.Serialize(new { properties = catalog.Properties, tab = selectedTab }, new JsonSerializerOptions(JsonSerializerDefaults.Web));')

          # Cleaner property Gallery / Blog admin screen: one purpose per sidebar link.
          write('src/DeLong.Web/Pages/Admin/Site/Editorial.cshtml', r'''@page
@model DeLong.Web.Pages.Admin.Site.EditorialModel
@{
    var isBlog = string.Equals(Context.Request.Query["tab"], "blog", StringComparison.OrdinalIgnoreCase);
    ViewData["Title"] = isBlog ? "Blog" : "Gallery";
}
@section Head {
    <link rel="stylesheet" href="~/css/site-cms.css" asp-append-version="true" />
    <link rel="stylesheet" href="~/css/editorial-admin.css" asp-append-version="true" />
}
<div id="editorial-admin" class="site-admin-page" v-cloak>
    <script id="editorial-admin-data" type="application/json">@Html.Raw(Model.PageDataJson)</script>
    <div class="page-title-row site-page-head">
        <div>
            <div class="page-eyebrow">Website · {{ propertyName }}</div>
            <h1>{{ tab === 'gallery' ? 'Gallery' : 'Blog' }}</h1>
            <p v-if="tab==='gallery'">Quản lý ảnh thật của cơ sở và cách bộ ảnh được trình bày ngoài website.</p>
            <p v-else>Viết, lưu nháp và xuất bản bài viết riêng cho cơ sở.</p>
        </div>
        <div class="site-head-actions">
            <a class="btn btn-light" v-bind:href="`/h/${siteSlug}`" target="_blank" rel="noopener">Xem trang cơ sở ↗</a>
            <a v-if="isAdmin" class="btn btn-light" v-bind:href="`/Admin/Site/EditorialGlobal?tab=${tab}`">Hiển thị trên trang chủ chung</a>
        </div>
    </div>

    <section v-if="loading" class="panel editorial-loading">Đang tải nội dung…</section>

    <section v-else-if="tab==='gallery'" class="editorial-section">
        <div class="site-home-toolbar panel editorial-toolbar">
            <div><span class="page-eyebrow">Thư viện ảnh</span><h2>Ảnh của cơ sở</h2><p>Tải nhiều ảnh cùng lúc. Ảnh được tối ưu tự động và có thể ẩn riêng từng ảnh.</p></div>
            <div class="editorial-toolbar-actions">
                <label class="editorial-layout-picker"><span>Kiểu hiển thị</span><select v-model="galleryLayout" v-on:change="saveGalleryLayout"><option value="mosaic">Mosaic</option><option value="grid">Grid</option><option value="slider">Slider</option></select></label>
                <label class="btn btn-primary file-btn">{{ uploading ? 'Đang tải…' : '+ Tải ảnh' }}<input type="file" multiple accept="image/png,image/jpeg,image/webp" v-bind:disabled="uploading" v-on:change="uploadGallery($event)" /></label>
            </div>
        </div>
        <div v-if="gallery.length" class="editorial-gallery-admin">
            <article class="panel editorial-gallery-card" v-for="item in gallery" v-bind:key="item.id"><img v-bind:src="item.imageUrl" v-bind:alt="item.altText" /><div class="editorial-gallery-copy"><input v-model="item.altText" placeholder="Mô tả ảnh cho SEO" /><input v-model="item.caption" placeholder="Chú thích ảnh" /><label class="site-toggle compact-toggle"><input type="checkbox" v-model="item.isPublished" /><span><strong>Hiển thị</strong></span></label><div class="editorial-card-actions"><button class="btn btn-light btn-sm" type="button" v-on:click="saveGallery(item)">Lưu</button><button class="btn btn-danger-outline btn-sm" type="button" v-on:click="deleteGallery(item)">Xóa</button></div></div></article>
        </div>
        <div v-else class="panel editorial-empty"><strong>Chưa có ảnh gallery.</strong><span>Tải ảnh không gian chung, mặt tiền, view, khu vực xung quanh hoặc trải nghiệm tại cơ sở.</span></div>
    </section>

    <section v-else class="editorial-section">
        <div class="site-home-toolbar panel"><div><span class="page-eyebrow">Bài viết</span><h2>Blog của cơ sở</h2><p>Nội dung hữu ích, câu chuyện không gian, hướng dẫn đi lại hoặc gợi ý trải nghiệm quanh cơ sở.</p></div><button class="btn btn-primary" type="button" v-on:click="openPost()">+ Viết bài</button></div>
        <div v-if="posts.length" class="editorial-post-list"><article class="panel editorial-post-card" v-for="post in posts" v-bind:key="post.id"><div class="editorial-post-cover"><img v-if="post.coverImageUrl" v-bind:src="post.coverImageUrl" v-bind:alt="post.title" /><span v-else>BLOG</span></div><div><span class="home-section-type">{{ post.isPublished ? 'Đã xuất bản' : 'Bản nháp' }}</span><h3>{{ post.title }}</h3><p>{{ post.excerpt }}</p><small>/h/{{ siteSlug }}/blog/{{ post.slug }}</small></div><div class="editorial-post-actions"><a v-if="post.isPublished" class="btn btn-light btn-sm" v-bind:href="`/h/${siteSlug}/blog/${post.slug}`" target="_blank" rel="noopener">Xem ↗</a><button class="btn btn-light btn-sm" type="button" v-on:click="openPost(post)">Sửa</button></div></article></div>
        <div v-else class="panel editorial-empty"><strong>Chưa có bài viết.</strong><span>Tạo bài đầu tiên để phần Blog trên trang cơ sở có nội dung.</span></div>
    </section>

    <div class="modal-backdrop" v-if="postEditor.open" v-on:click.self="closePost"><section class="modal-card editorial-post-editor" role="dialog" aria-modal="true"><div class="modal-head"><div><h2>{{ postEditor.id ? 'Sửa bài viết' : 'Viết bài mới' }}</h2><p class="small muted">Nội dung HTML được sanitize trước khi lưu.</p></div><button class="icon-btn" type="button" v-on:click="closePost">×</button></div><div class="site-modal-body editorial-post-form"><div class="field"><label>Tiêu đề</label><input v-model.trim="postForm.title" maxlength="240" /></div><div class="form-grid"><div class="field"><label>Slug</label><input v-model.trim="postForm.slug" placeholder="tu-dong-tu-tieu-de" /></div><label class="site-toggle"><input type="checkbox" v-model="postForm.isPublished" /><span><strong>Xuất bản</strong></span></label></div><div class="field"><label>Mô tả ngắn</label><textarea v-model.trim="postForm.excerpt" rows="3" maxlength="800"></textarea></div><div class="field"><label>Ảnh cover</label><div class="asset-input-row"><input v-model="postForm.coverImageUrl" /><label class="btn btn-light btn-sm file-btn">Tải ảnh<input type="file" accept="image/png,image/jpeg,image/webp" v-on:change="uploadPostCover($event)" /></label></div></div><div class="field"><label>Nội dung HTML</label><textarea class="editorial-html-editor" v-model="postForm.bodyHtml" rows="16" placeholder="<p>Nội dung bài viết...</p>"></textarea></div></div><div class="modal-actions"><button v-if="postEditor.id" class="btn btn-danger-outline" type="button" v-on:click="deletePost">Xóa bài</button><span class="modal-spacer"></span><button class="btn btn-light" type="button" v-on:click="closePost">Hủy</button><button class="btn btn-primary" type="button" v-bind:disabled="saving" v-on:click="savePost">{{ saving ? 'Đang lưu…' : 'Lưu bài' }}</button></div></section></div>
    <div class="toast" v-if="toast.show" v-bind:class="toast.type">{{ toast.message }}</div>
</div>
@section Scripts { <script src="~/js/pages/admin-editorial.js" asp-append-version="true"></script> }
''')

          write('src/DeLong.Web/wwwroot/js/pages/admin-editorial.js', r'''(function () {
    const root = document.getElementById('editorial-admin');
    if (!root || !window.Vue) return;
    const initial = JSON.parse(document.getElementById('editorial-admin-data')?.textContent || '{}');
    const { createApp } = Vue;
    createApp({
        data() {
            return {
                propertyId: initial.propertyId,
                propertyName: initial.propertyName || '',
                siteSlug: initial.siteSlug || '',
                isAdmin: initial.isAdmin === true,
                tab: initial.tab === 'blog' ? 'blog' : 'gallery',
                gallery: [], posts: [], galleryLayout: 'mosaic', loading: true, uploading: false, saving: false,
                postEditor: { open: false, id: null },
                postForm: { slug: '', title: '', excerpt: '', bodyHtml: '', coverImageUrl: '', isPublished: false },
                toast: { show: false, type: 'success', message: '' }
            };
        },
        mounted() { this.load(); },
        methods: {
            async load() {
                this.loading = true;
                try {
                    const data = await DeLongApi.get(`/api/admin/properties/${this.propertyId}/editorial/`);
                    this.gallery = data.gallery || [];
                    this.posts = data.posts || [];
                    this.galleryLayout = ['mosaic','grid','slider'].includes(data.galleryLayout) ? data.galleryLayout : 'mosaic';
                } catch (err) { this.notify(err.message || 'Không thể tải nội dung.', 'error'); }
                finally { this.loading = false; }
            },
            async saveGalleryLayout() {
                try { await DeLongApi.put(`/api/admin/properties/${this.propertyId}/editorial/gallery/layout`, { layout: this.galleryLayout }); this.notify('Đã đổi kiểu hiển thị Gallery.'); }
                catch (err) { this.notify(err.message || 'Không thể lưu kiểu Gallery.', 'error'); }
            },
            async uploadAsset(file) { const form = new FormData(); form.append('file', file); return await DeLongApi.postForm(`/api/admin/properties/${this.propertyId}/site/assets/section`, form); },
            async uploadGallery(event) {
                const files = Array.from(event.target.files || []); event.target.value = '';
                if (!files.length || this.uploading) return;
                this.uploading = true;
                try {
                    for (const file of files) {
                        const asset = await this.uploadAsset(file);
                        const created = await DeLongApi.post(`/api/admin/properties/${this.propertyId}/editorial/gallery`, { imageUrl: asset.url, altText: this.propertyName, caption: '', isPublished: true });
                        this.gallery.push(created);
                    }
                    this.notify(`Đã tải ${files.length} ảnh.`);
                } catch (err) { this.notify(err.message || 'Không thể tải gallery.', 'error'); }
                finally { this.uploading = false; }
            },
            async saveGallery(item) {
                try { const saved = await DeLongApi.put(`/api/admin/properties/${this.propertyId}/editorial/gallery/${item.id}`, { imageUrl: item.imageUrl, altText: item.altText, caption: item.caption, isPublished: item.isPublished }); Object.assign(item, saved); this.notify('Đã lưu ảnh.'); }
                catch (err) { this.notify(err.message || 'Không thể lưu ảnh.', 'error'); }
            },
            async deleteGallery(item) {
                if (!window.confirm('Xóa ảnh này khỏi gallery?')) return;
                try { await DeLongApi.delete(`/api/admin/properties/${this.propertyId}/editorial/gallery/${item.id}`); this.gallery = this.gallery.filter(x => x.id !== item.id); this.notify('Đã xóa ảnh.'); }
                catch (err) { this.notify(err.message || 'Không thể xóa ảnh.', 'error'); }
            },
            openPost(post) {
                if (post) { this.postEditor = { open: true, id: post.id }; this.postForm = { slug: post.slug || '', title: post.title || '', excerpt: post.excerpt || '', bodyHtml: post.bodyHtml || '', coverImageUrl: post.coverImageUrl || '', isPublished: post.isPublished === true }; }
                else { this.postEditor = { open: true, id: null }; this.postForm = { slug: '', title: '', excerpt: '', bodyHtml: '<p></p>', coverImageUrl: '', isPublished: false }; }
            },
            closePost() { if (!this.saving) this.postEditor.open = false; },
            async uploadPostCover(event) {
                const file = event.target.files?.[0]; event.target.value = ''; if (!file) return;
                try { const asset = await this.uploadAsset(file); this.postForm.coverImageUrl = asset.url; this.notify('Đã tải ảnh cover.'); }
                catch (err) { this.notify(err.message || 'Không thể tải ảnh cover.', 'error'); }
            },
            async savePost() {
                if (this.saving) return; this.saving = true;
                try {
                    const payload = Object.assign({}, this.postForm);
                    const saved = this.postEditor.id ? await DeLongApi.put(`/api/admin/properties/${this.propertyId}/editorial/posts/${this.postEditor.id}`, payload) : await DeLongApi.post(`/api/admin/properties/${this.propertyId}/editorial/posts`, payload);
                    const index = this.posts.findIndex(x => x.id === saved.id); if (index >= 0) this.posts.splice(index, 1, saved); else this.posts.unshift(saved);
                    this.postEditor.open = false; this.notify('Đã lưu bài viết.');
                } catch (err) { this.notify(err.message || 'Không thể lưu bài viết.', 'error'); }
                finally { this.saving = false; }
            },
            async deletePost() {
                if (!this.postEditor.id || !window.confirm('Xóa bài viết này?')) return; this.saving = true;
                try { await DeLongApi.delete(`/api/admin/properties/${this.propertyId}/editorial/posts/${this.postEditor.id}`); this.posts = this.posts.filter(x => x.id !== this.postEditor.id); this.postEditor.open = false; this.notify('Đã xóa bài viết.'); }
                catch (err) { this.notify(err.message || 'Không thể xóa bài viết.', 'error'); }
                finally { this.saving = false; }
            },
            notify(message, type = 'success') { this.toast = { show: true, message, type }; clearTimeout(this.toastTimer); this.toastTimer = setTimeout(() => { this.toast.show = false; }, 2800); }
        }
    }).mount(root);
})();
''')

          # Global homepage editorial controls are separated by Gallery vs Blog.
          write('src/DeLong.Web/Pages/Admin/Site/EditorialGlobal.cshtml', r'''@page
@model DeLong.Web.Pages.Admin.Site.EditorialGlobalModel
@{
    var isBlog = string.Equals(Context.Request.Query["tab"], "blog", StringComparison.OrdinalIgnoreCase);
    ViewData["Title"] = isBlog ? "Blog trang chủ" : "Gallery trang chủ";
}
@section Head {
    <link rel="stylesheet" href="~/css/site-cms.css" asp-append-version="true" />
    <link rel="stylesheet" href="~/css/editorial-admin.css" asp-append-version="true" />
}
<div id="editorial-global" class="site-admin-page" v-cloak>
    <script id="editorial-global-data" type="application/json">@Html.Raw(Model.PageDataJson)</script>
    <div class="page-title-row site-page-head"><div><div class="page-eyebrow">Trang chủ chung</div><h1>{{ tab === 'gallery' ? 'Gallery trên trang chủ' : 'Blog trên trang chủ' }}</h1><p>{{ tab === 'gallery' ? 'Chọn nguồn ảnh, kiểu hiển thị và số ảnh được phép xuất hiện trên homepage.' : 'Chọn nguồn bài viết và số bài được phép xuất hiện trên homepage.' }}</p></div><div class="site-head-actions"><a class="btn btn-light" v-bind:href="`/Admin/Site/Editorial?tab=${tab}`">Quản lý {{ tab === 'gallery' ? 'Gallery' : 'Blog' }} cơ sở</a><a class="btn btn-light" href="/" target="_blank" rel="noopener">Xem website ↗</a></div></div>

    <section v-if="loading" class="panel editorial-loading">Đang tải cấu hình…</section>
    <div v-else class="site-settings-layout">
        <div class="site-settings-main">
