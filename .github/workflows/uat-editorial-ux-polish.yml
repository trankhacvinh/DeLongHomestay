          insert = '''                @if (canManageSite)\n                {\n                    <div class="nav-group">\n                        <div class="nav-label">Website</div>\n                        <a class="@NavClass("/Admin/Site", true)" asp-page="/Admin/Site/Index" asp-route-propertyId="@propertyId"><svg><use href="#i-settings" /></svg><span>Trang cơ sở</span></a>\n                        @if (User.IsInRole("Admin"))\n                        {\n                            <a class="@NavClass("/Admin/Site/Global", true)" asp-page="/Admin/Site/Global"><svg><use href="#i-grid" /></svg><span>Trang chủ chung</span></a>\n                        }\n                        <a class="@(path.StartsWith("/Admin/Site/Editorial", StringComparison.OrdinalIgnoreCase) && editorialTab == "gallery" ? "side-link active" : "side-link")" asp-page="/Admin/Site/Editorial" asp-route-propertyId="@propertyId" asp-route-tab="gallery"><svg><use href="#i-image" /></svg><span>Gallery</span></a>\n                        <a class="@(path.StartsWith("/Admin/Site/Editorial", StringComparison.OrdinalIgnoreCase) && editorialTab == "blog" ? "side-link active" : "side-link")" asp-page="/Admin/Site/Editorial" asp-route-propertyId="@propertyId" asp-route-tab="blog"><svg><use href="#i-article" /></svg><span>Blog</span></a>\n                        <a class="side-link" href="/" target="_blank" rel="noopener"><svg><use href="#i-external" /></svg><span>Xem website</span></a>\n                    </div>\n                }\n'''
          repl(p, '                @if (User.IsInRole("Admin") || User.IsInRole("Manager") || User.IsInRole("Viewer"))\n', insert + '                @if (User.IsInRole("Admin") || User.IsInRole("Manager") || User.IsInRole("Viewer"))\n')
          repl(p, '</svg>\n@if (isAdmin)', '    <symbol id="i-image" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM7 15l3-3 2 2 2-2 3 3M8 9h.01"/></symbol>\n    <symbol id="i-article" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM8 8h8M8 12h8M8 16h5"/></symbol>\n    <symbol id="i-external" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M19 13v6H5V5h6"/></symbol>\n</svg>\n@if (isAdmin)')

          PY
