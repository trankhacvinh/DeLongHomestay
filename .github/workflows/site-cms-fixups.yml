name: Apply Site CMS Fixups

on:
  push:
    branches: [agent/site-cms-and-lookup]
    paths:
      - '.github/workflows/site-cms-fixups.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-cms-and-lookup
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 tools/site_cms_fixups.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DeLong.Web/Features/Site/SiteContentService.cs src/DeLong.Web/Features/Site/SiteAssetStorage.cs src/DeLong.Web/wwwroot/js/pages/booking-lookup.js
          git commit -m "fix: harden site CMS runtime behavior"
          git push origin HEAD:agent/site-cms-and-lookup
