name: Polish Property Editorial

on:
  push:
    branches: [ "agent/property-editorial-polish" ]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/property-gallery-blog
          fetch-depth: 0
      - name: Keep friendly seeded room slugs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/DeLong.Web/Data/Seed/DbSeeder.cs')
          text = path.read_text()
          old = '            Slug = code.ToLowerInvariant(),\n'
          new = '''            Slug = code switch\n            {\n                "COCO-01" => "coco-blue-1",\n                "ABAUS-02" => "abaus-2",\n                "HONGKONG-03" => "hongkong-3",\n                "MOON-04" => "moon-stone-4",\n                "AMBER-05" => "amber-stay-5",\n                "ROMAN-06" => "la-roman-6",\n                _ => code.ToLowerInvariant()\n            },\n'''
          if old not in text:
              raise SystemExit('seed slug line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DeLong.Web/Data/Seed/DbSeeder.cs
          git commit -m "fix: keep friendly seeded room slugs"
          git push origin HEAD:feat/property-gallery-blog
