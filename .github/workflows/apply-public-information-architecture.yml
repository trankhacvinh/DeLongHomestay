name: Apply Public Information Architecture

on:
  push:
    branches: [ agent/site-cms-and-lookup ]
    paths:
      - ".github/workflows/apply-public-information-architecture.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__DefaultConnection: "Host=localhost;Port=5432;Database=delong_dev;Username=postgres;Password=postgres"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-cms-and-lookup
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.0.10
      - name: Restore
        run: dotnet restore DeLongHomestay.sln
      - name: Apply refactor
        shell: bash
        run: |
          cat .github/refactor-payload/part*.b64 > /tmp/apply.b64
          base64 -d /tmp/apply.b64 | gzip -d > scripts/.apply-public-information-architecture.py
          python scripts/.apply-public-information-architecture.py
      - name: Generate migration
        run: dotnet ef migrations add GlobalPublicHomepage --project src/DeLong.Web --startup-project src/DeLong.Web --output-dir Data/Migrations
      - name: Build
        run: dotnet build DeLongHomestay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DeLongHomestay.sln --configuration Release --no-build
      - name: JavaScript syntax
        run: |
          node --check src/DeLong.Web/wwwroot/js/pages/admin-global-site.js
          node --check src/DeLong.Web/wwwroot/js/pages/admin-site-cms.js
      - name: Commit refactor
        shell: bash
        run: |
          rm -rf .github/refactor-payload
          rm -f .github/workflows/apply-public-information-architecture.yml
          rm -f scripts/.apply-public-information-architecture.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add global public homepage and cross-property catalog"
          git push origin HEAD:agent/site-cms-and-lookup
