name: Apply Editor Polish Transform

on:
  push:
    branches: [feat/editor-polish-stabilization]

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/editor-polish-stabilization
          fetch-depth: 0
      - name: Apply repeated homepage visual hooks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/DeLong.Web/Pages/Index.cshtml')
          text = path.read_text(encoding='utf-8')
          original = text

          feature_old = '@foreach (var item in items) { if (!string.IsNullOrWhiteSpace(item?.ToString())) { <span>@item</span> } }'
          feature_new = '@foreach (var pair in items.Select((item, index) => new { Item = item, Index = index })) { if (!string.IsNullOrWhiteSpace(pair.Item?.ToString())) { <span class="@(V(block.Content, $"items.{pair.Index}"))">@pair.Item</span> } }'
          text = text.replace(feature_old, feature_new)

          nearby_old = '@foreach (var item in nearby) { if (!string.IsNullOrWhiteSpace(item?.ToString())) { <span>@item</span> } }'
          nearby_new = '@foreach (var pair in nearby.Select((item, index) => new { Item = item, Index = index })) { if (!string.IsNullOrWhiteSpace(pair.Item?.ToString())) { <span class="@(V(block.Content, $"nearby.{pair.Index}"))">@pair.Item</span> } }'
          text = text.replace(nearby_old, nearby_new)

          faq_old = '@foreach (var item in faqItems.OfType<JsonObject>()) { var question = Text(item, "question"); var answer = Text(item, "answer"); if (!string.IsNullOrWhiteSpace(question) && !string.IsNullOrWhiteSpace(answer)) { <details><summary>@question<span>+</span></summary><p>@answer</p></details> } }'
          faq_new = '@foreach (var pair in faqItems.OfType<JsonObject>().Select((item, index) => new { Item = item, Index = index })) { var question = Text(pair.Item, "question"); var answer = Text(pair.Item, "answer"); if (!string.IsNullOrWhiteSpace(question) && !string.IsNullOrWhiteSpace(answer)) { <details><summary class="@(V(block.Content, $"items.{pair.Index}.question"))">@question<span>+</span></summary><p class="@(V(block.Content, $"items.{pair.Index}.answer"))">@answer</p></details> } }'
          text = text.replace(faq_old, faq_new)

          policy_old = '@foreach (var item in policies.OfType<JsonObject>()) { var policyTitle = Text(item, "title"); var policyBody = Text(item, "body"); if (!string.IsNullOrWhiteSpace(policyTitle) || !string.IsNullOrWhiteSpace(policyBody)) { policyIndex++; <article><span>@policyIndex.ToString("00")</span><h3>@policyTitle</h3><p>@policyBody</p></article> } }'
          policy_new = '@foreach (var pair in policies.OfType<JsonObject>().Select((item, index) => new { Item = item, Index = index })) { var policyTitle = Text(pair.Item, "title"); var policyBody = Text(pair.Item, "body"); if (!string.IsNullOrWhiteSpace(policyTitle) || !string.IsNullOrWhiteSpace(policyBody)) { policyIndex++; <article><span>@policyIndex.ToString("00")</span><h3 class="@(V(block.Content, $"items.{pair.Index}.title"))">@policyTitle</h3><p class="@(V(block.Content, $"items.{pair.Index}.body"))">@policyBody</p></article> } }'
          text = text.replace(policy_old, policy_new)

          if text == original:
              raise SystemExit('No repeated homepage hooks changed')
          if text.count('V(block.Content') < 30:
              raise SystemExit(f'Expected broader visual hooks, got {text.count("V(block.Content")}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit transformed page
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DeLong.Web/Pages/Index.cshtml
          git commit -m "feat(editor): persist repeated item styles on homepage"
          git push origin HEAD:feat/editor-polish-stabilization
