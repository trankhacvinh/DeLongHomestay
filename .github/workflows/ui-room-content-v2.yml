name: Generate Room Content UI Override

on:
  push:
    branches: [ "agent/room-content-v2" ]

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate room content page override
        shell: bash
        run: |
          set -euo pipefail
          TARGET="design-system/de-long-homestay/pages/room-content.md"
          if [ -f "$TARGET" ]; then
            echo "Room content override already generated; skipping."
            exit 0
          fi
          SCRIPT="src/DeLong.Web/.codex/skills/ui-ux-pro-max/scripts/search.py"
          QUERY="hotel hospitality admin room content editor gallery media manager rich text amenities tags publishing boutique calm professional"
          python3 "$SCRIPT" "$QUERY" --design-system --persist -p "De Long Homestay" -f markdown --page room-content -o .
      - name: Commit override
        shell: bash
        run: |
          if git diff --quiet -- design-system/ && [ -z "$(git status --porcelain design-system/)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system/
          git commit -m "docs: add room content ui override"
          git push origin HEAD:agent/room-content-v2
