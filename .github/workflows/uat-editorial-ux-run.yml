name: Execute Editorial UX Polish

on:
  push:
    branches: [ "feat/property-gallery-blog" ]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/property-gallery-blog
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet restore DeLongHomestay.sln
      - name: Apply saved UX patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/uat-editorial-ux-polish.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          raw = workflow[start:end]
          code = "\n".join(line[10:] if line.startswith("          ") else line for line in raw.splitlines())
          exec(compile(code, 'editorial-ux-polish.py', 'exec'))
          PY
      - name: Generate EF migration
        run: dotnet ef migrations add EditorialGalleryLayouts --project src/DeLong.Web --startup-project src/DeLong.Web --output-dir Data/Migrations
      - name: Validate
        run: |
          dotnet build DeLongHomestay.sln --no-restore
          dotnet test DeLongHomestay.sln --no-build
          node --check src/DeLong.Web/wwwroot/js/pages/admin-editorial.js
          node --check src/DeLong.Web/wwwroot/js/pages/admin-editorial-global.js
          node --check src/DeLong.Web/wwwroot/js/pages/public-editorial-gallery.js
          dotnet ef migrations has-pending-model-changes --project src/DeLong.Web --startup-project src/DeLong.Web
      - name: Commit cleaned result
        shell: bash
        run: |
          rm .github/workflows/uat-editorial-ux-polish.yml .github/workflows/uat-editorial-ux-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ux: polish gallery blog navigation"
          git push origin HEAD:feat/property-gallery-blog
