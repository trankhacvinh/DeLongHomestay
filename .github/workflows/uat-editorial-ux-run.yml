name: Execute Editorial UX Polish

on:
  push:
    branches: [ "feat/property-gallery-blog" ]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/property-gallery-blog
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool install --global dotnet-ef --version 10.0.10
      - run: dotnet restore DeLongHomestay.sln
      - name: Apply saved UX patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/uat-editorial-ux-polish.yml').read_text()
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          lines = workflow[start:end].splitlines()
          first = next((line for line in lines if line.strip()), '')
          indent = first[:len(first) - len(first.lstrip())]
          code = "\n".join(line[len(indent):] if indent and line.startswith(indent) else line for line in lines)
          exec(compile(code, 'editorial-ux-polish.py', 'exec'))

          for path in ['src/DeLong.Web/Pages/Admin/Site/Editorial.cshtml', 'src/DeLong.Web/Pages/Admin/Site/EditorialGlobal.cshtml']:
              text = Path(path).read_text()
              text = text.replace('Context.Request.Query["tab"]', 'Request.Query["tab"]')
              Path(path).write_text(text)

          path = Path('src/DeLong.Web/Features/Site/GlobalEditorialShowcaseService.cs')
          text = path.read_text()
          old = '        "Một vài khoảnh khắc tại De Long",\n        true,\n        "all",'
          new = '        "Một vài khoảnh khắc tại De Long",\n        "mosaic",\n        true,\n        "all",'
          if old not in text:
              raise SystemExit('DefaultDto gallery layout insertion point not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Compile patched source
        run: dotnet build DeLongHomestay.sln --no-restore
      - name: Generate EF migration
        run: dotnet ef migrations add EditorialGalleryLayouts --project src/DeLong.Web --startup-project src/DeLong.Web --output-dir Data/Migrations --no-build
      - name: Validate
        run: |
          dotnet test DeLongHomestay.sln --no-build
          node --check src/DeLong.Web/wwwroot/js/pages/admin-editorial.js
          node --check src/DeLong.Web/wwwroot/js/pages/admin-editorial-global.js
          node --check src/DeLong.Web/wwwroot/js/pages/public-editorial-gallery.js
          dotnet ef migrations has-pending-model-changes --project src/DeLong.Web --startup-project src/DeLong.Web --no-build
      - name: Commit cleaned result
        shell: bash
        run: |
          rm .github/workflows/uat-editorial-ux-polish.yml .github/workflows/uat-editorial-ux-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ux: polish gallery blog navigation"
          git push origin HEAD:feat/property-gallery-blog
