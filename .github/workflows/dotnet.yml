name: .NET

on:
  push:
    branches: [ main, "agent/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore DeLongHomestay.sln
      - name: Build
        run: dotnet build DeLongHomestay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DeLongHomestay.sln --configuration Release --no-build --verbosity normal
