name: Property Storytelling Dev

on:
  push:
    branches:
      - feat/property-storytelling

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/property-storytelling
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Apply storytelling patch
        run: python3 scripts/property_storytelling_patch.py
      - name: Restore
        run: dotnet restore DeLongHomestay.sln
      - name: Build
        run: dotnet build DeLongHomestay.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test DeLongHomestay.sln --configuration Release --no-build --verbosity normal
      - name: JavaScript syntax
        shell: bash
        run: find src/DeLong.Web/wwwroot/js -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Commit patch and remove temporary tooling
        shell: bash
        run: |
          rm .github/workflows/property-storytelling-dev.yml scripts/property_storytelling_patch.py
          git config user.name "trankhacvinh"
          git config user.email "trankhacvinh@users.noreply.github.com"
          git add -A
          git commit -m "feat: add property storytelling blocks"
          git push origin HEAD:feat/property-storytelling
