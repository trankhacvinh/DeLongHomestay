name: Apply SEO Publishing Center Transform

on:
  push:
    branches: [feat/seo-publishing-center]

permissions:
  contents: write

jobs:
  transform:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-publishing-center
          fetch-depth: 0
      - name: Apply custom page SEO fields and redirect history
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/DeLong.Web/Features/Site/CustomPageStore.cs')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
          '''    string SeoDescription,\n    string OgImageUrl,\n    int SectionCount,''',
          '''    string SeoDescription,\n    string OgImageUrl,\n    bool NoIndex,\n    string CanonicalUrl,\n    IReadOnlyList<string> LegacySlugs,\n    int SectionCount,''', 1)

          text = text.replace(
          '''    string SeoDescription,\n    string OgImageUrl,\n    IReadOnlyList<HomeSectionDto> Sections,''',
          '''    string SeoDescription,\n    string OgImageUrl,\n    bool NoIndex,\n    string CanonicalUrl,\n    IReadOnlyList<string> LegacySlugs,\n    IReadOnlyList<HomeSectionDto> Sections,''', 1)

          text = text.replace(
          '''        public string OgImageUrl { get; init; } = string.Empty;\n        public IReadOnlyList<PageSectionPayload> Sections { get; init; } = [];''',
          '''        public string OgImageUrl { get; init; } = string.Empty;\n        public bool NoIndex { get; init; }\n        public string CanonicalUrl { get; init; } = string.Empty;\n        public IReadOnlyList<string> LegacySlugs { get; init; } = [];\n        public IReadOnlyList<PageSectionPayload> Sections { get; init; } = [];''', 1)

          text = text.replace(
          '''            SeoDescription = Limit(Clean(request.SeoDescription), 500),\n            OgImageUrl = Limit(Clean(request.OgImageUrl), 1200),\n            Sections = TemplateSections(request.Template, title)''',
          '''            SeoDescription = Limit(Clean(request.SeoDescription), 500),\n            OgImageUrl = Limit(Clean(request.OgImageUrl), 1200),\n            NoIndex = false,\n            CanonicalUrl = string.Empty,\n            LegacySlugs = [],\n            Sections = TemplateSections(request.Template, title)''', 1)

          text = text.replace(
          '''            SeoDescription = Limit(Clean(request.SeoDescription), 500),\n            OgImageUrl = Limit(Clean(request.OgImageUrl), 1200),\n            Sections = current.Sections''',
          '''            SeoDescription = Limit(Clean(request.SeoDescription), 500),\n            OgImageUrl = Limit(Clean(request.OgImageUrl), 1200),\n            NoIndex = current.NoIndex,\n            CanonicalUrl = current.CanonicalUrl,\n            LegacySlugs = NextLegacySlugs(current, slug),\n            Sections = current.Sections''', 1)

          text = text.replace(
          '''            SeoTitle = sourcePayload.SeoTitle,\n            SeoDescription = sourcePayload.SeoDescription,\n            OgImageUrl = sourcePayload.OgImageUrl,\n            Sections = sections''',
          '''            SeoTitle = sourcePayload.SeoTitle,\n            SeoDescription = sourcePayload.SeoDescription,\n            OgImageUrl = sourcePayload.OgImageUrl,\n            NoIndex = false,\n            CanonicalUrl = string.Empty,\n            LegacySlugs = [],\n            Sections = sections''', 1)

          marker = '''    public async Task<CustomPageSectionMutationResult> CreateSectionAsync(Guid? propertyId, Guid pageId, SaveHomeSectionRequest request, CancellationToken ct = default)\n'''
          methods = '''    public async Task<CustomPageDto?> GetByLegacySlugAsync(Guid? propertyId, string slug, bool publishedOnly, CancellationToken ct = default)\n    {\n        var normalized = NormalizeSlug(slug);\n        if (string.IsNullOrWhiteSpace(normalized)) return null;\n        var rows = await db.Set<HomeSection>().AsNoTracking()\n            .Where(x => x.PropertyId == propertyId && x.Type == MetadataSectionType)\n            .ToListAsync(ct);\n        var siteSlug = await ResolveSiteSlugAsync(propertyId, ct);\n        return rows.Select(row => Read(row, siteSlug))\n            .FirstOrDefault(page => page.LegacySlugs.Any(old => string.Equals(old, normalized, StringComparison.OrdinalIgnoreCase)) && (!publishedOnly || page.IsPublished));\n    }\n\n    public async Task<SiteContentError?> UpdateSeoAsync(Guid? propertyId, Guid pageId, bool noIndex, string? canonicalUrl, CancellationToken ct = default)\n    {\n        var row = await FindTrackedRowAsync(propertyId, pageId, ct);\n        if (row is null) return new("not_found", "Không tìm thấy trang nội dung.");\n        var canonical = Clean(canonicalUrl);\n        if (!IsSafeCanonicalUrl(canonical)) return new("validation", "Canonical phải là URL http/https hoặc đường dẫn nội bộ bắt đầu bằng /. ");\n        var payload = ReadPayload(row);\n        var next = new Payload\n        {\n            Title = payload.Title, Slug = payload.Slug, IsPublished = payload.IsPublished,\n            HideFromNavigation = payload.HideFromNavigation, SeoTitle = payload.SeoTitle,\n            SeoDescription = payload.SeoDescription, OgImageUrl = payload.OgImageUrl,\n            NoIndex = noIndex, CanonicalUrl = Limit(canonical, 1200), LegacySlugs = payload.LegacySlugs,\n            Sections = payload.Sections\n        };\n        row.ContentJson = Serialize(next);\n        row.Name = payload.Title;\n        row.IsVisible = false;\n        row.SortOrder = int.MinValue + 20;\n        await db.SaveChangesAsync(ct);\n        return null;\n    }\n\n    public async Task<SiteContentError?> RemoveLegacySlugAsync(Guid? propertyId, Guid pageId, string legacySlug, CancellationToken ct = default)\n    {\n        var row = await FindTrackedRowAsync(propertyId, pageId, ct);\n        if (row is null) return new("not_found", "Không tìm thấy trang nội dung.");\n        var normalized = NormalizeSlug(legacySlug);\n        var payload = ReadPayload(row);\n        if (!payload.LegacySlugs.Any(x => string.Equals(x, normalized, StringComparison.OrdinalIgnoreCase)))\n            return new("not_found", "Không tìm thấy redirect cũ.");\n        var next = new Payload\n        {\n            Title = payload.Title, Slug = payload.Slug, IsPublished = payload.IsPublished,\n            HideFromNavigation = payload.HideFromNavigation, SeoTitle = payload.SeoTitle,\n            SeoDescription = payload.SeoDescription, OgImageUrl = payload.OgImageUrl,\n            NoIndex = payload.NoIndex, CanonicalUrl = payload.CanonicalUrl,\n            LegacySlugs = payload.LegacySlugs.Where(x => !string.Equals(x, normalized, StringComparison.OrdinalIgnoreCase)).ToList(),\n            Sections = payload.Sections\n        };\n        row.ContentJson = Serialize(next);\n        await db.SaveChangesAsync(ct);\n        return null;\n    }\n\n'''
          if marker in text and 'UpdateSeoAsync(Guid? propertyId' not in text:
              text = text.replace(marker, methods + marker, 1)

          text = text.replace(
          '''        return rows.Select(ReadPayload).Any(x => string.Equals(x.Slug, slug, StringComparison.OrdinalIgnoreCase));''',
          '''        return rows.Select(ReadPayload).Any(x =>\n            string.Equals(x.Slug, slug, StringComparison.OrdinalIgnoreCase) ||\n            x.LegacySlugs.Any(old => string.Equals(old, slug, StringComparison.OrdinalIgnoreCase)));''', 1)

          text = text.replace(
          '''            HideFromNavigation = payload.HideFromNavigation, SeoTitle = payload.SeoTitle,\n            SeoDescription = payload.SeoDescription, OgImageUrl = payload.OgImageUrl, Sections = sections''',
          '''            HideFromNavigation = payload.HideFromNavigation, SeoTitle = payload.SeoTitle,\n            SeoDescription = payload.SeoDescription, OgImageUrl = payload.OgImageUrl,\n            NoIndex = payload.NoIndex, CanonicalUrl = payload.CanonicalUrl, LegacySlugs = payload.LegacySlugs, Sections = sections''', 1)

          text = text.replace(
          '''            payload.HideFromNavigation, payload.SeoTitle, payload.SeoDescription, payload.OgImageUrl,\n            payload.Sections.OrderBy(x => x.SortOrder).Select(ToDto).ToList(), row.CreatedAtUtc, row.UpdatedAtUtc);''',
          '''            payload.HideFromNavigation, payload.SeoTitle, payload.SeoDescription, payload.OgImageUrl,\n            payload.NoIndex, payload.CanonicalUrl, payload.LegacySlugs,\n            payload.Sections.OrderBy(x => x.SortOrder).Select(ToDto).ToList(), row.CreatedAtUtc, row.UpdatedAtUtc);''', 1)

          text = text.replace(
          '''        page.SeoTitle, page.SeoDescription, page.OgImageUrl, page.Sections.Count, page.CreatedAtUtc, page.UpdatedAtUtc);''',
          '''        page.SeoTitle, page.SeoDescription, page.OgImageUrl, page.NoIndex, page.CanonicalUrl, page.LegacySlugs,\n        page.Sections.Count, page.CreatedAtUtc, page.UpdatedAtUtc);''', 1)

          helper_marker = '''    private static bool IsSafeImageUrl(string? value)\n'''
          helpers = '''    private static IReadOnlyList<string> NextLegacySlugs(Payload current, string nextSlug)\n    {\n        if (string.Equals(current.Slug, nextSlug, StringComparison.OrdinalIgnoreCase)) return current.LegacySlugs;\n        return current.LegacySlugs\n            .Append(current.Slug)\n            .Select(NormalizeSlug)\n            .Where(x => !string.IsNullOrWhiteSpace(x) && !string.Equals(x, nextSlug, StringComparison.OrdinalIgnoreCase))\n            .Distinct(StringComparer.OrdinalIgnoreCase)\n            .TakeLast(20)\n            .ToList();\n    }\n\n    private static bool IsSafeCanonicalUrl(string? value)\n    {\n        if (string.IsNullOrWhiteSpace(value)) return true;\n        var url = value.Trim();\n        if (url.StartsWith("/", StringComparison.Ordinal) && !url.StartsWith("//", StringComparison.Ordinal)) return true;\n        return Uri.TryCreate(url, UriKind.Absolute, out var absolute) && absolute.Scheme is "http" or "https";\n    }\n\n'''
          if helper_marker in text and 'NextLegacySlugs(Payload current' not in text:
              text = text.replace(helper_marker, helpers + helper_marker, 1)

          if text == original:
              raise SystemExit('CustomPageStore transform made no changes')
          required = ['LegacySlugs', 'UpdateSeoAsync', 'RemoveLegacySlugAsync', 'GetByLegacySlugAsync', 'NextLegacySlugs']
          missing = [x for x in required if x not in text]
          if missing: raise SystemExit('Missing CustomPageStore transforms: ' + ', '.join(missing))
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply redirect and page robots behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/DeLong.Web/Pages/CustomPage.cshtml.cs')
          text = path.read_text(encoding='utf-8')
          original = text

          text = text.replace(
          '''            PageContent = await customPageStore.GetBySlugAsync(null, slug, !allowDraft, ct) ?? null!;\n            if (PageContent is null || (!PageContent.IsPublished && !allowDraft)) return NotFound();''',
          '''            PageContent = await customPageStore.GetBySlugAsync(null, slug, !allowDraft, ct) ?? null!;\n            if (PageContent is null)\n            {\n                var legacy = await customPageStore.GetByLegacySlugAsync(null, slug, true, ct);\n                if (legacy is not null) return RedirectPermanent(legacy.Url);\n                return NotFound();\n            }\n            if (!PageContent.IsPublished && !allowDraft) return NotFound();\n            ApplySeoOverrides(PageContent);''', 1)

          text = text.replace(
          '''        PageContent = await customPageStore.GetBySlugAsync(property.Id, slug, !allowPropertyDraft, ct) ?? null!;\n        if (PageContent is null || (!PageContent.IsPublished && !allowPropertyDraft)) return NotFound();''',
          '''        PageContent = await customPageStore.GetBySlugAsync(property.Id, slug, !allowPropertyDraft, ct) ?? null!;\n        if (PageContent is null)\n        {\n            var legacy = await customPageStore.GetByLegacySlugAsync(property.Id, slug, true, ct);\n            if (legacy is not null) return RedirectPermanent(legacy.Url);\n            return NotFound();\n        }\n        if (!PageContent.IsPublished && !allowPropertyDraft) return NotFound();\n        ApplySeoOverrides(PageContent);''', 1)

          marker = '''    public IReadOnlyList<PublicPropertyCardDto> SelectGlobalProperties(JsonObject content)\n'''
          helper = '''    private void ApplySeoOverrides(CustomPageDto page)\n    {\n        if (page.NoIndex) ViewData["Robots"] = "noindex,follow";\n        if (string.IsNullOrWhiteSpace(page.CanonicalUrl)) return;\n        var canonical = page.CanonicalUrl.Trim();\n        ViewData["CanonicalUrl"] = canonical.StartsWith('/')\n            ? $"{Request.Scheme}://{Request.Host}{canonical}"\n            : canonical;\n    }\n\n'''
          if marker in text and 'ApplySeoOverrides(CustomPageDto page)' not in text:
              text = text.replace(marker, helper + marker, 1)

          if text == original: raise SystemExit('CustomPage model transform made no changes')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Exclude noindex custom pages from sitemap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/DeLong.Web/Features/Site/PublicSeoEndpoints.cs')
          text = path.read_text(encoding='utf-8')
          original = text
          text = text.replace('urls.AddRange(globalPages.Select(page => new SitemapEntry(page.Url, page.UpdatedAtUtc)));', 'urls.AddRange(globalPages.Where(page => !page.NoIndex).Select(page => new SitemapEntry(page.Url, page.UpdatedAtUtc)));')
          text = text.replace('urls.AddRange(propertyPages.Select(page => new SitemapEntry(page.Url, page.UpdatedAtUtc)));', 'urls.AddRange(propertyPages.Where(page => !page.NoIndex).Select(page => new SitemapEntry(page.Url, page.UpdatedAtUtc)));')
          text = text.replace('scopedUrls.AddRange(pages.Select(page => new SitemapEntry(page.Url, page.UpdatedAtUtc)));', 'scopedUrls.AddRange(pages.Where(page => !page.NoIndex).Select(page => new SitemapEntry(page.Url, page.UpdatedAtUtc)));')
          if text == original: raise SystemExit('Sitemap transform made no changes')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit transformed files
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DeLong.Web/Features/Site/CustomPageStore.cs src/DeLong.Web/Pages/CustomPage.cshtml.cs src/DeLong.Web/Features/Site/PublicSeoEndpoints.cs
          git commit -m "feat(seo): persist page index controls and slug redirects"
          git push origin HEAD:feat/seo-publishing-center
