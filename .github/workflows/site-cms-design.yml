name: Generate Site CMS Design Overrides

on:
  push:
    branches: [agent/site-cms-and-lookup]
    paths:
      - '.github/workflows/site-cms-design.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/site-cms-and-lookup

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Generate page design overrides
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT="src/DeLong.Web/.codex/skills/ui-ux-pro-max/scripts/search.py"
          QUERY="boutique homestay hospitality CMS property settings SEO homepage block editor elegant calm data-dense admin"

          python3 "$SCRIPT" "$QUERY" --design-system --persist -p "De Long Homestay" -f markdown --page site-settings-cms -o .
          python3 "$SCRIPT" "hospitality guest booking lookup confirmation code phone self service simple trustworthy mobile" --design-system --persist -p "De Long Homestay" -f markdown --page booking-lookup -o .

      - name: Commit generated overrides
        shell: bash
        run: |
          if git diff --quiet -- design-system/ && [ -z "$(git status --porcelain design-system/)" ]; then
            echo "No design-system changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add design-system/
          git commit -m "docs: add site cms design overrides"
          git push origin HEAD:agent/site-cms-and-lookup
