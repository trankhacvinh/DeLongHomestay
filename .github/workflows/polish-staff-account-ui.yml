name: Polish Staff And Account UI

on:
  push:
    branches: [ "agent/staff-accounts" ]
    paths:
      - '.github/workflows/polish-staff-account-ui.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/staff-accounts
      - name: Apply UI polish
        run: python3 .github/scripts/polish_staff_account_ui.py
      - name: Commit UI polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/DeLong.Web/wwwroot/css/operational-polish.css src/DeLong.Web/wwwroot/css/staff.css src/DeLong.Web/wwwroot/js/core/shell.js src/DeLong.Web/Pages/Account/ChangePassword.cshtml
          git commit -m "style: improve staff spacing and account security UX"
          git push origin HEAD:agent/staff-accounts
