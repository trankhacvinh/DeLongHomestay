name: Staff Accounts Design Guidance

on:
  push:
    branches: [agent/staff-accounts]
    paths:
      - '.github/workflows/ui-staff-design.yml'

jobs:
  design-guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate design system guidance
        run: |
          python3 src/DeLong.Web/.codex/skills/ui-ux-pro-max/scripts/search.py "hospitality admin staff user management roles permissions data-dense professional" --design-system -p "De Long Homestay Staff Accounts"
          python3 src/DeLong.Web/.codex/skills/ui-ux-pro-max/scripts/search.py "admin user management roles permissions form table accessibility" --stack vue
